id: X-0001
title: 학습 유형 이론
claim: 아이마다 시각형·청각형·체감형이 있으니 거기에 맞춰 가르쳐야 한다
grade: A
evidence:
  - 유형에 맞춘 수업이 성적을 올린다는 실험 근거는 거의 없다 (Pashler 외 2008)
  - 사람마다 '좋아하는 방식'은 있지만 그 방식으로 배워야 더 잘 배우는 것은 아니다
  - 내용에 맞는 방식이 따로 있다. 지도는 그림으로, 발음은 소리로 배운다
spread:
  - 아이를 이해하고 싶은 마음에 잘 맞는 단순한 설명
  - 검사지와 교구가 함께 팔리면서 넓게 퍼짐
instead:
  - 유형을 찾기보다 [[인출 연습]]과 [[간격 효과]]처럼 누구에게나 통하는 방법부터
  - 아이가 좋아하는 방식은 '시작하기 쉽게' 만드는 데만 쓰기
sources: [pashler-2008, dunlosky-2013]
books: [make-it-stick]
related: [좌뇌형 우뇌형]
history:
  - date: '2026.10.27'
    note: 등재
