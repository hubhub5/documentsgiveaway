id: X-0003
title: 벼락치기가 효율적이다
claim: 시험 직전에 몰아서 보는 게 기억이 생생해서 더 효율적이다
grade: A
evidence:
  - 같은 시간이라도 나눠서 본 쪽이 장기 기억에서 꾸준히 앞섬 (Cepeda 외 2006)
  - 카드 학습에서 대부분 간격이 나았지만 다수는 몰아 보기가 낫다고 믿었음 (Kornell 2009)
spread:
  - 바로 다음 날 시험에는 몰아 보기도 어느 정도 통하기 때문
  - 몰아 볼 때 '많이 했다'는 느낌이 강함 → [[유창성 착각]]
instead:
  - 같은 시간을 사흘로 쪼개기 → [[간격 두고 다시 꺼내기]]
  - 전날엔 새로 보지 말고 꺼내 보기만
sources: [cepeda-2006, kornell-2009]
books: [make-it-stick]
related: [여러 번 읽으면 외워진다, 잠 줄여 공부하면 성적이 오른다]
history:
  - date: '2026.10.27'
    note: 등재
