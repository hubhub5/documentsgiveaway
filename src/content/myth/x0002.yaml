id: X-0002
title: 좌뇌형 우뇌형
claim: 논리적인 아이는 좌뇌형, 창의적인 아이는 우뇌형이라 공부법이 달라야 한다
grade: B
evidence:
  - 1000명 넘는 뇌 영상 분석에서 한쪽 뇌를 전반적으로 더 쓰는 사람을 찾지 못함 (Nielsen 외 2013)
  - 언어처럼 한쪽에 치우친 기능은 있지만 사람 단위의 '형'으로 나뉘지는 않음
spread:
  - 분리뇌 환자 연구가 대중서로 옮겨지며 단순해짐
  - 아이 성향을 한 단어로 설명해 주는 편리함
instead:
  - 아이가 잘하는 방식은 뇌 유형이 아니라 연습량과 경험으로 봄
  - 과목별로 [[인출 연습]]·[[섞어 풀기]] 같은 공통 방법을 먼저
sources: [nielsen-2013]
related: [학습 유형 이론]
history:
  - date: '2026.10.27'
    note: 등재
