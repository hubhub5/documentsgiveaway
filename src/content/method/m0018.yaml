id: M-0018
title: 다시 시작하는 날 정하기
line: 밀린 계획을 메우지 않고, 달력에서 '새로 시작하는 날'을 하나 골라 그날부터 다시 세는 방법
time: 3분
tools: 달력
ages: 초4 이상
mode: 둘 다
grade: C
basis: [새 출발 효과, 자기 자비]
steps:
  - 밀린 분량은 지우거나 다른 칸으로 옮긴다
  - 가까운 월요일이나 1일에 '다시 1일차'라고 쓴다
  - 그날 할 양은 원래의 절반으로 정한다
mistakes:
  - 밀린 것까지 다 메우는 계획을 세운다
  - 다시 시작하는 날을 너무 멀리 잡는다
sources: [dai-2014, breines-2012]
books: [atomic-habits]
history:
  - date: '2026.10.27'
    note: 등재
