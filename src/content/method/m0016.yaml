id: M-0016
title: 휴대폰 다른 방에 두기
line: 공부하는 동안 휴대폰을 뒤집어 두지 않고 아예 다른 방에 두는 방법
time: 10초
tools: 충전기 하나
ages: 전 연령
mode: 둘 다
grade: C
basis: [휴대폰의 존재 효과]
steps:
  - 공부 시작 전에 거실 충전기에 꽂는다
  - 알람이 필요하면 탁상시계를 쓴다
  - 쉬는 시간에만 가지러 간다
mistakes:
  - 엄마가 몰래 가져가서 갈등이 커진다
  - 가족 모두 휴대폰을 쥐고 있으면서 아이에게만 요구한다
sources: [ward-2017]
books: [stolen-focus]
