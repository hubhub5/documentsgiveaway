id: M-0001
title: 백지 인출
line: 책을 덮고 빈 종이에 기억나는 것을 전부 쓴 다음, 빠진 곳만 다시 보는 방법
time: 10~15분
tools: A4 한 장, 펜 두 색
ages: 초4 이상
mode: 둘 다
grade: A
basis: [인출 연습, 간격 효과]
steps:
  - 공부한 범위의 제목만 종이 맨 위에 쓴다
  - 책을 덮고 5분 동안 떠오르는 것을 순서 없이 쓴다
  - 막히면 비워 둔다. 억지로 채우지 않는다
  - 책을 펴고 다른 색 펜으로 빠진 것만 채운다
  - 다른 색으로 쓴 부분만 이틀 뒤에 다시 꺼내 본다
mistakes:
  - 책을 슬쩍 보면서 쓴다. 이러면 다시 읽기와 같아짐
  - 처음부터 빈칸 없이 완벽하게 쓰려고 한다
  - 엄마가 빈칸을 보고 "이것도 몰라?" 하고 말한다
sheet: [날짜, 범위, 처음 쓴 개수, 빠진 것, 이틀 뒤 다시]
sources: [roediger-2006, karpicke-2011, cepeda-2006]
books: [make-it-stick, unknown]
history:
  - date: '2026.10.27'
    note: 등재
