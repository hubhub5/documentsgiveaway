id: M-0002
title: 간격 두고 다시 꺼내기
line: 외운 것을 하루, 사흘, 일주일 간격으로 책 덮고 다시 꺼내 보는 일정
time: 하루 5–10분
tools: 달력이나 플래너
ages: 초4 이상
mode: 둘 다
grade: A
basis: [간격 효과, 인출 연습]
steps:
  - 오늘 외운 범위를 달력 오늘 칸에 적는다
  - 같은 범위를 다음 날, 사흘 뒤, 일주일 뒤 칸에도 적는다
  - 그날 칸에 적힌 범위만 책 덮고 [[백지 인출]]로 꺼낸다
  - 다 나온 범위는 다음 간격을 더 벌린다
mistakes:
  - 꺼내지 않고 다시 읽기만 한다
  - 간격을 지키느라 새 진도를 아예 멈춘다
  - 시험 전날 한꺼번에 몰아서 복습한다
sheet: [외운 날, 범위, +1일, +3일, +7일]
sources: [cepeda-2006, kornell-2009]
books: [make-it-stick]
history:
  - date: '2026.10.27'
    note: 등재
