id: M-0009
title: 멈출 곳 정하고 시작하기
line: 어디까지 할지가 아니라 '어디서 멈출지'를 먼저 정하고 시작하는 방법
time: 1분
tools: 연필
ages: 초4 이상
mode: 혼자
grade: D
basis: [계획 오류, 미루기와 기분 조절]
steps:
  - 문제집에서 오늘 멈출 쪽에 연필로 선을 긋는다
  - 선은 할 수 있을 것 같은 양의 3분의 2 지점에 긋는다
  - 선에 닿으면 남았어도 멈춘다
  - 다음 날은 선 바로 뒤에서 시작한다
mistakes:
  - 잘 될 때 선을 넘어서 끝까지 간다. 다음 날 시작이 무거워짐
  - 선을 처음부터 많이 긋는다
sources: [buehler-1994]
books: [unknown]
history:
  - date: '2026.10.27'
    note: 등재
