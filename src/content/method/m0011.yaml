id: M-0011
title: 확신도 오답 노트
line: 틀린 이유를 길게 쓰는 대신, 풀 때 얼마나 확신했는지만 표시하고 확신하고 틀린 것부터 다시 보는 방법
time: 문제당 10초
tools: 빨간 펜
ages: 초5 이상
mode: 혼자
grade: B
basis: [오류에서 배우기]
steps:
  - 문제를 풀 때 번호 옆에 확신도를 상·중·하로 적는다
  - 채점 후 '상인데 틀린 것'에 빨간 동그라미
  - 빨간 동그라미부터 정답을 보고 다시 푼다
  - 이틀 뒤 빨간 동그라미만 다시 꺼내 푼다
mistakes:
  - 오답 노트를 예쁘게 옮겨 적는 데 시간을 다 쓴다
  - 틀린 이유를 '실수'로만 적는다
sheet: [번호, 확신도, 맞음/틀림, 이틀 뒤]
sources: [butterfield-2001, metcalfe-2017]
books: [make-it-stick]
history:
  - date: '2026.10.27'
    note: 등재
