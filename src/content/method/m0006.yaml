id: M-0006
title: 만약-그러면 계획
line: '"○○하면 바로 △△한다"는 한 줄로 시작 시점을 미리 정해 두는 방법'
time: 3분
tools: 포스트잇
ages: 초4 이상
mode: 둘 다
grade: A
basis: [실행 의도]
steps:
  - 매일 빠지지 않고 일어나는 일을 하나 고른다. 예 저녁 설거지 끝
  - '"그게 끝나면 바로 ○○ 문제집 한 쪽"이라고 쓴다'
  - 책상 위나 냉장고에 붙인다
  - 일주일 뒤 몇 번 지켰는지 세고 조건을 고친다
mistakes:
  - 조건을 '시간 나면', '기분 좋으면'처럼 흐릿하게 잡는다
  - 행동을 '수학 공부'처럼 크게 잡는다
sources: [gollwitzer-1999, gollwitzer-2006]
books: [atomic-habits]
history:
  - date: '2026.10.27'
    note: 등재
