id: M-0003
title: 시험 전 걱정 쓰기
line: 시험 직전 10분 동안 지금 걱정되는 것을 아무에게도 안 보여 줄 종이에 쏟아내는 방법
time: 10분
tools: 종이 한 장
ages: 중1 이상
mode: 혼자
grade: B
basis: [표현적 글쓰기, 시험 불안]
steps:
  - 시험 시작 전 10분, 조용한 자리에서 종이를 편다
  - 지금 걱정되는 것을 문장이 엉망이어도 계속 쓴다
  - 맞춤법, 순서, 말이 되는지는 신경 쓰지 않는다
  - 다 쓰면 접어서 가방에 넣는다. 다시 읽지 않는다
mistakes:
  - 쓴 걸 엄마나 친구에게 보여 준다
  - 걱정 대신 공부 내용을 정리한다
  - 시험장에서 할 수 없으면 집에서 출발 전에 해도 된다는 걸 모른다
sources: [ramirez-2011, pennebaker-1997]
books: [reasonless-calm]
history:
  - date: '2026.10.27'
    note: 등재
