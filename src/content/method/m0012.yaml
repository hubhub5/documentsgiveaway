id: M-0012
title: 이름 불러 혼잣말
line: 속으로 '나'라고 하지 않고 자기 이름을 불러 말을 거는 방법
time: 10초
tools: 없음
ages: 초4 이상
mode: 혼자
grade: B
basis: [거리 두기 혼잣말]
steps:
  - 막히거나 자책이 시작될 때 알아차린다
  - '"○○아, 지금 뭐가 막혔어?"처럼 이름으로 묻는다'
  - 친구에게 말하듯 한 문장으로 답한다
mistakes:
  - 이름을 부르며 혼낸다
  - 소리 내서 해야 한다고 생각한다. 속으로도 됨
sources: [kross-2014]
books: [reasonless-calm]
history:
  - date: '2026.10.27'
    note: 등재
