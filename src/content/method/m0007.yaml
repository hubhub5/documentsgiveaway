id: M-0007
title: WOOP 네 칸
line: 소망·결과·장애물·계획 네 칸을 순서대로 채우는 5분짜리 계획법
time: 5분
tools: 네 칸 종이
ages: 중1 이상
mode: 둘 다
grade: B
basis: [심리적 대조, 실행 의도]
steps:
  - 소망 이번 주 안에 이루고 싶은 것 한 줄
  - 결과 그게 되면 가장 좋은 점을 잠깐 떠올린다
  - 장애물 바깥 사정 말고 내 안에서 막는 것 하나
  - 계획 그 장애물이 오면 할 행동 하나를 만약-그러면으로
mistakes:
  - 장애물을 '시간이 없음'처럼 바깥에서 찾는다
  - 결과 상상만 길게 하고 장애물로 안 넘어간다
sheet: [소망, 결과, 장애물, 만약-그러면]
sources: [duckworth-2011]
books: [atomic-habits]
history:
  - date: '2026.10.27'
    note: 등재
