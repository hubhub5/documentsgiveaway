id: M-0010
title: 섞어 풀기
line: 단원별로 몰아 푸는 대신 여러 단원 문제를 섞어서 푸는 방법
time: 20–30분
tools: 문제집 두세 단원
ages: 초5 이상
mode: 혼자
grade: B
basis: [교차 연습, 바람직한 어려움]
steps:
  - 이미 배운 단원 두세 개를 고른다
  - 단원마다 문제 서너 개씩 골라 번호를 섞는다
  - 풀기 전에 '이건 무슨 유형이지'를 먼저 적는다
  - 틀린 문제는 유형을 잘못 고른 건지, 계산인지 나눈다
mistakes:
  - 처음 배우는 단원부터 섞는다
  - 틀리는 게 늘어서 효과가 없다고 그만둔다
sources: [rohrer-2007]
books: [make-it-stick]
history:
  - date: '2026.10.27'
    note: 등재
