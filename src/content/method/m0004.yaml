id: M-0004
title: 긴장 다시 읽기
line: 두근거림을 없애려 하지 않고 '몸이 준비하는 신호'라고 한 문장으로 다시 읽는 방법
time: 10초–1분
tools: 없음
ages: 중1 이상
mode: 혼자
grade: B
basis: [각성 재평가]
steps:
  - 심장이 빨라지는 걸 알아차린다
  - '"진정해" 대신 "몸이 준비하는 중"이라고 속으로 말한다'
  - 손끝이나 발바닥에 잠깐 주의를 둔다
  - 첫 문제를 읽는다
mistakes:
  - 긴장을 없애야 시작할 수 있다고 믿고 기다린다
  - 너무 큰 공포에도 말로만 버틴다. 이럴 땐 [[날숨 길게 쉬기]]가 먼저
sources: [jamieson-2010, brooks-2014]
books: [how-emotions, unknown]
history:
  - date: '2026.10.27'
    note: 등재
