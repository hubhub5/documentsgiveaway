id: M-0014
title: 숨은 전제 한 줄 쓰기
line: 주장 문장 아래에 '이 말이 맞으려면 무엇이 당연해야 하나'를 한 줄로 쓰는 연습
time: 문장당 1분
tools: 신문 기사나 지문
ages: 중1 이상
mode: 둘 다
grade: C
basis: [숨은 전제]
steps:
  - 주장 하나와 그 근거를 찾는다
  - '"근거가 맞으면 주장도 맞으려면…" 뒤를 채운다'
  - 그 한 줄이 언제나 참인지 반례를 하나 떠올린다
  - 반례가 있으면 그 지점이 선지의 함정이 되는 곳
mistakes:
  - 근거를 다시 쓴 것을 전제라고 착각한다
  - 전제를 찾으면 주장이 틀렸다고 단정한다
sources: [toulmin-1958]
books: [rulebook-arguments]
history:
  - date: '2026.10.27'
    note: 등재
