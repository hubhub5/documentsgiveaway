id: M-0013
title: 문단에 역할 붙이기
line: 문단마다 '주장·근거·예시·반론·전환' 중 하나를 여백에 적으며 읽는 방법
time: 지문당 3분
tools: 연필
ages: 초5 이상
mode: 혼자
grade: A
basis: [텍스트 구조, 상황 모델]
steps:
  - 지문을 한 번 끝까지 읽는다
  - 문단 옆 여백에 역할을 한 단어로 적는다
  - 역할이 바뀌는 문단 앞 접속어에 동그라미
  - 주장 문단만 이어서 읽어 글 전체를 한 줄로 말해 본다
mistakes:
  - 모든 문장에 밑줄을 긋는다
  - 첫 문단을 무조건 주장이라고 정한다
sources: [meyer-1980, hebert-2016]
books: [reading-brain]
history:
  - date: '2026.10.27'
    note: 등재
