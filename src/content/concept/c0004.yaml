id: C-0004
title: 바람직한 어려움
en: Desirable difficulties
origin: Robert Bjork(1994)
field: 인지심리학
line: 연습할 때 조금 어렵게 느껴지는 조건이 오히려 오래 남는 학습을 만든다
grade: A
replication: 대체로 확인
caveat: 아무 어려움이나 좋은 게 아니다. 꺼내기·나누기·섞기처럼 처리 과정을 늘리는 어려움에 한함
studies:
