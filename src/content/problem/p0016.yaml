id: P-0016
title: 성적이 나온 뒤 며칠 무기력함
category: 감정·자기평가
line: 성적표를 받은 뒤 며칠간 책을 아예 펴지 않고 '해도 안 된다'만 반복하는 상황
ages: [중등, 고등]
grade: B
facets:
  when: [결과 후]
  where: [집 책상, 거실]
  with: [혼자]
  subject: [전 과목]
  freq: 가끔
factors:
  main: 무력감
  sub: [수치심·자책, 부담·기대]
says:
  - who: 아이
    text: 해 봤자 어차피 이 점수야
  - who: 아이
    text: 그냥 좀 내버려 둬
signals:
  body: [잠이 늘어남, 식욕 변화]
  thought: ['노력해도 소용없어', '난 원래 이 정도']
  action: [방에서 안 나옴, 학원 숙제를 안 함]
flow:
  trigger: 열심히 했다고 느낀 과목의 점수가 낮게 나옴
  thought: '"그렇게 했는데도 이거야?"'
  feel: 몸에 힘이 빠지고 눕고 싶어짐
  pattern: 공부 관련 대화를 피하고 누워 있는 시간이 늘어남
  break: '"해도 안 된다"를 사실로 받아들임'
  residue: 다음 시험 준비 시작이 늦어짐
causes:
  - 노력과 결과가 연결되지 않는 경험이 반복됨 → [[학습된 무기력]]
  - 결과를 바뀌지 않는 원인에 돌림 → [[귀인]]
  - 효과가 낮은 방법(다시 읽기)으로 노력해서 노력이 결과로 안 이어졌을 수 있음 → [[유창성 착각]]
triggers:
  - text: 이번 시험에서 오른 것 하나만 찾아 말해 주기
    when: 성적 본 날
    time: 1분
    who: 엄마
    grade: D
  - text: 이틀은 쉬어도 된다고 날짜를 정해 주기
    when: 성적 본 날
    time: 30초
    who: 엄마
    grade: D
  - text: 공부 방법 하나만 바꿔서 작은 시험 보기
    when: 사흘째
    time: 15분
    who: 같이
    grade: B
solutions:
  - method: '[[백지 인출]]'
    basis: '[[자기효능감]]'
    grade: B
    time: 10분
    age: 초4 이상
  - method: '[[다시 시작하는 날 정하기]]'
    basis: '[[새 출발 효과]]'
    grade: C
    time: 3분
    age: 초4 이상
talk:
  - avoid: 그러니까 더 열심히 했어야지
    instead: 열심히 한 거 알아. 방법을 하나 바꿔 보자
  - avoid: 언제까지 누워만 있을 거야
    instead: 목요일까지는 쉬고, 금요일에 같이 보자
small:
  today: 아무것도 안 해도 되는 날로 정하기
  week: 방법 하나 바꿔서 단원 하나만 쪽지 시험
  month: 노력한 시간 말고 '방법별 결과'를 기록
recovery:
  - 쉬는 날을 정하고 그 뒤에 스스로 책을 폄
  - '"이 방법은 별로였어"처럼 방법 탓을 함'
expert:
  - 무기력이 2주 넘게 이어지고 잠·식사가 크게 바뀌었을 때
  - 죽고 싶다는 말을 할 때. 바로 상담 기관에 연락
limits: 학습된 무기력의 원 연구는 동물. 사람 대상 개입 근거는 간접적이다.
related: [어제 외운 것을 오늘 다 잊음, 부모를 실망시킬까 두려움]
sources: [maier-2016, weiner-1985, bandura-1977, callender-2009]
books: [optimistic-child, reasonless-calm]
history:
  - date: '2026.10.27'
    note: 등재
