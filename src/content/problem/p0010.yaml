id: P-0010
title: 매번 계획보다 늦어지다 포기함
category: 시작·지속
line: 계획한 분량이 매일 조금씩 밀리다가 주 후반엔 계획표 자체를 안 보게 되는 상황
ages: [중등, 고등]
grade: A
facets:
  when: [공부 중, 결과 후]
  where: [집 책상, 독서실]
  with: [혼자]
  subject: [전 과목]
  freq: 매주
factors:
  main: 무력감
  sub: [완벽주의, 수치심·자책]
says:
  - who: 아이
    text: 이번 주도 망했어
  - who: 아이
    text: 계획 다시 짤래
signals:
  body: [밤마다 피곤, 한숨]
  thought: ['오늘 못 한 거 내일 두 배', '난 계획대로 한 적이 없어']
  action: [계획표를 새로 만듦, 밀린 칸을 볼펜으로 지움]
scene:
  - time: 목요일 밤 11시, 플래너 펼친 책상
    lines:
      - who: 아이
        text: 월화수 다 못 했네
flow:
  trigger: 첫날 분량이 예상보다 오래 걸림
  thought: '"내일 더 하면 돼"'
  feel: 조급함, 밤으로 갈수록 무거움
  pattern: 밀린 분량을 다음 날에 얹어서 하루 양이 점점 커짐
  break: 목요일쯤 '이번 주는 끝'이라고 판단하고 손을 놓음
  residue: 새 계획을 짜는 데 시간을 씀 → [[계획 세우는 데만 시간을 씀]]
causes:
  - 걸리는 시간을 언제나 짧게 예상함 → [[계획 오류]]
  - 밀린 분량을 다음 날에 더해서 계획이 점점 비현실적이 됨
  - 지키지 못한 날을 나 자신의 문제로 해석 → [[귀인]]
triggers:
  - text: 밀린 분량은 지우고 오늘 분량만 하기
    when: 밀린 걸 볼 때
    time: 10초
    who: 본인
    grade: D
  - text: 계획 시간을 지난번 실제 걸린 시간으로 다시 적기
    when: 계획 짤 때
    time: 3분
    who: 본인
    grade: A
  - text: 하루 분량을 3분의 2로 줄여 선 긋기
    when: 하루 시작
    time: 1분
    who: 본인
    grade: D
solutions:
  - method: '[[멈출 곳 정하고 시작하기]]'
    basis: '[[계획 오류]]'
    grade: D
    time: 1분
    age: 초4 이상
  - method: '[[다시 시작하는 날 정하기]]'
    basis: '[[새 출발 효과]]'
    grade: C
    time: 3분
    age: 초4 이상
  - method: '[[WOOP 네 칸]]'
    basis: '[[심리적 대조]]'
    grade: B
    time: 5분
    age: 중1 이상
talk:
  - avoid: 계획만 세우면 뭐 해
    instead: 지난주 계획 중에 실제로 몇 분 걸렸는지 같이 볼까
  - avoid: 밀린 거 주말에 다 해
    instead: 밀린 건 지우고 내일부터 다시 세자
small:
  today: 내일 계획을 오늘 한 실제 시간 기준으로 다시 쓰기
  week: 밀린 분량을 다음 날로 넘기지 않는 규칙 지키기
  month: 계획 시간과 실제 시간 차이를 매주 기록해 비율 보기
recovery:
  - 계획보다 덜 했어도 '오늘 한 만큼'을 기록함
  - 주 후반에도 계획표를 펴 봄
expert:
  - 반복되는 실패감에 잠, 식사까지 흔들릴 때
limits: 계획 오류는 대학생과 성인 연구가 대부분. 하루 분량 3분의 2 규칙은 현장 관찰(D).
leadsTo: [계획 세우는 데만 시간을 씀]
related: [하루 밀리면 전부 놓아버림, 완벽하게 못 할 바엔 안 함]
sources: [buehler-1994, weiner-1985, dai-2014, duckworth-2011]
books: [thinking-fast-slow, atomic-habits]
history:
  - date: '2026.10.27'
    note: 등재
