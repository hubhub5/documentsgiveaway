id: P-0018
title: 잘하던 과목에서 무너진 뒤 피함
category: 감정·자기평가
line: 늘 잘하던 과목에서 한 번 크게 틀린 뒤 그 과목 문제집을 펴지 않게 되는 상황
ages: [초고, 중등, 고등]
grade: B
facets:
  when: [결과 후, 시작 전]
  where: [집 책상]
  with: [혼자]
  subject: [수리, 암기]
  freq: 가끔
factors:
  main: 수치심·자책
  sub: [회피, 과거 경험]
says:
  - who: 아이
    text: 수학은 이제 내 과목 아니야
  - who: 엄마
    text: 너 수학 잘했잖아
signals:
  body: [그 과목 시간에 배가 아픔]
  thought: ['이제 나보다 잘하는 애가 많아', '원래 못했던 건가']
  action: [그 과목 숙제를 맨 뒤로 미룸, 다른 과목만 함]
flow:
  trigger: 자신 있던 과목에서 예상보다 크게 낮은 점수
  thought: '"난 이거 잘하는 애였는데"'
  feel: 당황, 그리고 부끄러움
  pattern: 그 과목을 피하고 잘되는 과목으로 시간을 옮김
  break: 실제 실력 차이가 벌어져 '역시 못하는구나'가 확인됨
  residue: '"잘하는 애" 이름표가 "못하는 애"로 바뀜'
causes:
  - 잘한다는 칭찬을 능력으로 받아 틀림이 정체성 위협이 됨 → [[능력 칭찬과 과정 칭찬]]
  - 원인을 능력 탓으로 봄 → [[귀인]]
  - 실패가 들킬까 봐 노력 자체를 줄임 → [[자기 불구화]]
triggers:
  - text: 그 과목 제일 쉬운 단원 문제 다섯 개부터
    when: 다시 펼 때
    time: 10분
    who: 본인
    grade: B
  - text: '"잘하던 애" 말고 "이번 단원이 어려웠다"로 말하기'
    when: 이야기할 때
    time: 30초
    who: 엄마
    grade: D
solutions:
  - method: '[[확신도 오답 노트]]'
    basis: '[[오류에서 배우기]]'
    grade: B
    time: 문제당 10초
    age: 초5 이상
  - method: '[[2분 시작]]'
    basis: '[[자기효능감]]'
    grade: D
    time: 2분
    age: 전 연령
talk:
  - avoid: 너 원래 수학 잘했잖아
    instead: 이번 단원이 어려웠나 봐. 어디부터 막혔어?
small:
  today: 그 과목 쉬운 문제 다섯 개만 맞히고 끝내기
  week: 틀린 단원 하나만 골라 이틀 간격으로 두 번 보기
  month: 그 과목 공부 시간을 다른 과목과 같은 시간대로 옮기기
recovery:
  - 그 과목 숙제를 맨 뒤가 아니라 중간에 함
  - '"이 단원이 어려웠어"라고 범위를 좁혀 말함'
expert:
  - 특정 과목 시간마다 몸이 아파 보건실에 자주 갈 때
limits: 칭찬 연구는 초등 5학년 실험 중심. 고등 이상은 간접 근거.
related: [혼난 과목을 피함, 틀리면 바로 자책함]
sources: [mueller-1998, weiner-1985, berglas-1978, bandura-1977, butterfield-2001]
books: [mindset, unknown]
history:
  - date: '2026.10.27'
    note: 등재
