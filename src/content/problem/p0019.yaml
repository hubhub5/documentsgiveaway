id: P-0019
title: 책상 앞에서 배나 머리가 아픔
category: 몸
line: 공부하려고 앉거나 시험 전날이 되면 배나 머리가 아프다고 하고, 쉬면 금방 괜찮아지는 상황
ages: [초저, 초고, 중등]
grade: C
facets:
  when: [시작 전, 시험 직전]
  where: [집 책상, 교실]
  with: [혼자, 엄마 옆]
  subject: [전 과목]
  freq: 매주
factors:
  main: 신체 각성
  sub: [불안·긴장, 과거 경험]
says:
  - who: 아이
    text: 엄마, 나 배 아파
  - who: 엄마
    text: 또 공부할 때만 아프지
  - who: 아이
    text: 진짜 아프단 말이야
signals:
  body: [복통, 두통, 화장실을 자주 감, 메스꺼움]
  thought: ['오늘은 못 하겠다']
  action: [책상에 엎드림, 소파로 감]
scene:
  - time: 일요일 밤 8시, 월요일 단원평가 전날
    lines:
      - who: 아이
        text: 배가 꼬이는 것 같아
      - who: 엄마
        text: 내일 시험이라 그래?
flow:
  trigger: 공부나 시험을 떠올림
  thought: '"또 망치면 어떡하지"'
  feel: 배가 조이고 머리가 무거워짐
  pattern: 아픔 때문에 공부를 멈추고 쉬면 나아짐
  break: '"꾀병"이라는 말을 듣고 아픔과 억울함이 겹침'
  residue: 공부 장면과 몸의 불편이 더 단단히 묶임
causes:
  - 긴장은 실제로 소화와 근육에 반응을 만든다. 꾀병과 다름 → [[시험 불안]]
  - 쉬면 나아지는 경험이 회피를 강화함
  - 예전에 혼났던 장면이 몸에 먼저 떠오를 수 있음 → [[혼난 과목을 피함]]
triggers:
  - text: '"아프구나"를 먼저 인정하고 배에 손 얹고 숨 쉬기'
    when: 아프다고 할 때
    time: 1분
    who: 같이
    grade: C
  - text: 주먹 쥐었다 펴기, 어깨 올렸다 떨어뜨리기
    when: 앉기 전
    time: 1분
    who: 본인
    grade: A
  - text: 오늘 분량을 아주 작게 줄여서 앉기만 해 보기
    when: 나아진 뒤
    time: 5분
    who: 같이
    grade: D
solutions:
  - method: '[[힘 줬다 풀기]]'
    basis: '[[이완 훈련]]'
    grade: A
    time: 1–2분
    age: 전 연령
  - method: '[[날숨 길게 쉬기]]'
    basis: '[[느린 호흡]]'
    grade: C
    time: 30초
    age: 전 연령
talk:
  - avoid: 공부할 때만 아프지
    instead: 아프구나. 어디가 제일 불편해?
  - avoid: 참고 해
    instead: 숨 같이 쉬고 5분만 앉아 볼까
small:
  today: 아프다고 할 때 '꾀병' 대신 몸 위치를 같이 짚어 보기
  week: 공부 전 1분 이완을 다섯 번
  month: 아픈 날과 시험·공부 일정을 달력에 같이 적어 보기
recovery:
  - 아프다고 한 뒤에도 짧게라도 앉음
  - 아픈 횟수가 시험 주간에도 조금 줄어듦
expert:
  - 복통이 밤에 깨울 정도이거나 체중이 줄 때. 먼저 소아과 진료
  - 학교 가기 전 매일 아프다고 할 때
limits: 몸 증상은 질병일 수 있다. 진료로 다른 원인을 먼저 확인한 뒤 이 문서를 쓸 것.
related: [숨을 참고 어깨가 굳음, 시험 중 머리가 하얘짐, 혼난 과목을 피함]
sources: [hembree-1988, manzoni-2008, zaccaro-2018]
books: [reasonless-calm, body-keeps-score, emotion-coaching]
history:
  - date: '2026.10.27'
    note: 등재
