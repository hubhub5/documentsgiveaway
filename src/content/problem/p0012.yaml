id: P-0012
title: 하루 밀리면 전부 놓아버림
category: 시작·지속
line: 하루를 빼먹으면 '이미 망했다'며 그 주, 그 달 전체를 놓아 버리는 상황
ages: [초고, 중등, 고등]
grade: C
facets:
  when: [결과 후, 시작 전]
  where: [집 책상]
  with: [혼자]
  subject: [전 과목]
  freq: 매주
factors:
  main: 완벽주의
  sub: [수치심·자책, 무력감]
says:
  - who: 아이
    text: 어제 못 했으니까 이번 주는 그냥 쉴래
  - who: 아이
    text: 다음 달 1일부터 제대로 할게
signals:
  body: [힘이 빠짐]
  thought: ['이미 망했어', '처음부터 다시']
  action: [단어장 앱 연속 기록이 끊기면 앱을 지움, 다음 달을 기다림]
flow:
  trigger: 하루 계획을 통째로 못 함
  thought: '"연속 기록 끊겼다"'
  feel: 허탈함, 조금은 홀가분함
  pattern: 남은 날도 의미 없다고 봄
  break: '"다음 주 월요일부터"로 미룸'
  residue: 시작과 포기가 주기처럼 반복됨
causes:
  - 하나라도 빠지면 전부 실패라는 기준 → [[완벽주의]]
  - 실패한 나를 다그치는 말이 다시 시작할 힘을 깎음 → [[자기 자비]]
triggers:
  - text: 놓친 날은 그냥 X 표시하고 오늘 칸만 보기
    when: 밀린 다음 날
    time: 10초
    who: 본인
    grade: D
  - text: 오늘 원래 분량의 절반만 하기
    when: 다시 앉을 때
    time: 1분
    who: 본인
    grade: D
  - text: 친구가 이랬으면 뭐라고 할지 한 줄 떠올리기
    when: 자책이 올 때
    time: 1분
    who: 본인
    grade: B
solutions:
  - method: '[[다시 시작하는 날 정하기]]'
    basis: '[[새 출발 효과]]'
    grade: C
    time: 3분
    age: 초4 이상
  - method: '[[친구에게 하듯 다시 말하기]]'
    basis: '[[자기 자비]]'
    grade: B
    time: 1분
    age: 초4 이상
talk:
  - avoid: 거봐, 또 작심삼일이지
    instead: 하루 빠진 거야. 오늘 반만 하자
small:
  today: 오늘 분량을 절반으로 정하고 끝내기
  week: 빠진 날이 있어도 다음 날 반이라도 한 횟수 세기
  month: 연속 기록 대신 '한 달 중 한 날' 수를 기록
recovery:
  - 빠진 다음 날 바로 다시 앉은 적이 생김
  - '"다음 달부터"라는 말이 줄어듦'
expert:
  - 실패한 날마다 심하게 자신을 비난하거나 울 때
limits: '"하루 빠지면 전부" 패턴의 직접 연구는 적다. 완벽주의·자기 자비 연구에서 추론.'
related: [매번 계획보다 늦어지다 포기함, 완벽하게 못 할 바엔 안 함]
sources: [curran-2019, breines-2012, dai-2014]
books: [atomic-habits, love-yourself]
history:
  - date: '2026.10.27'
    note: 등재
