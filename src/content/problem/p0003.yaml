id: P-0003
title: 외운 것이 떠오르지 않음/중학생
category: 기억·인출
line: 처음 치르는 지필고사에서 외운 개념이 안 나오고, 점수보다 '나 공부 못하는 애였나'가 더 크게 남는 상황
ages: [중등]
grade: A
facets:
  when: [시험 중, 결과 후]
  where: [교실]
  with: [혼자]
  subject: [암기, 서술]
  freq: 가끔
factors:
  main: 수치심·자책
  sub: [비교·조바심, 불안·긴장]
says:
  - who: 아이
    text: 초등학교 땐 이 정도는 다 맞았는데
  - who: 아이
    text: 다른 애들은 다 쉬웠대
signals:
  body: [시험 시간 내내 다리를 떪, 손에 땀]
  thought: ['중학교는 나랑 안 맞나', '이번에 망하면 끝']
  action: [OMR 마킹을 몇 번씩 확인, 쉬는 시간에 답 맞춰 보다 더 불안해짐]
scene:
  - time: 중1 2학기 첫 지필, 과학. 서술형 2번
    lines:
      - who: 아이
        text: (속으로) 광합성 식 그거, 앞부분만 생각나
flow:
  trigger: 서술형에서 외운 문장의 앞부분만 떠오름
  thought: '"초등 땐 이런 적 없었는데"'
  feel: 목 뒤가 뻣뻣해지고 시간이 빨리 가는 느낌
  pattern: 쉬는 시간에 친구들과 답을 맞춰 보며 틀린 개수를 셈
  break: 다음 과목 시작 전에 이미 '이번 시험 망함'으로 정리함
  residue: 결과와 상관없이 '난 중학교 공부 체질 아님'이 남음
causes:
  - 초등 시험은 직전 복습만으로 되던 양이었음 → [[간격 효과]]
  - 쉬는 시간 답 맞추기가 다음 과목 작업기억을 갉아먹음 → [[압박 속 수행 저하]]
  - 한 과목 결과를 나라는 사람 전체로 일반화 → [[귀인]]
triggers:
  - text: 쉬는 시간엔 답 맞추기 대신 다음 과목 목차만 보기
    when: 과목 사이
    time: 5분
    who: 본인
    grade: D
  - text: 서술형은 떠오른 앞부분이라도 먼저 쓰고 넘어가기
    when: 시험 중
    time: 10초
    who: 본인
    grade: D
  - text: '"몸이 준비하는 중" 하고 첫 문제 읽기'
    when: 시험지 받을 때
    time: 10초
    who: 본인
    grade: B
solutions:
  - method: '[[간격 두고 다시 꺼내기]]'
    basis: '[[간격 효과]]'
    grade: A
    time: 하루 10분
    age: 중1 이상
  - method: '[[시험 전 걱정 쓰기]]'
    basis: '[[표현적 글쓰기]]'
    grade: B
    time: 10분
    age: 중1 이상
talk:
  - avoid: 중학교 공부는 원래 달라
    instead: 초등 때랑 뭐가 제일 다르게 느껴졌어?
  - avoid: 몇 등이야?
    instead: 어떤 문제에서 시간이 제일 오래 걸렸어?
small:
  today: 오늘 수업 개념 하나를 책 덮고 한 줄로 써 보기
  week: 서술형 문제 세 개를 답 보지 않고 써 보고 채점
  month: 시험 3주 전부터 과목별로 사흘 간격 복습 달력 만들기
recovery:
  - 쉬는 시간 답 맞추기를 안 하고 넘어간 과목이 생김
  - '"이번엔 서술형 앞부분은 썼어"처럼 부분을 말함'
expert:
  - 시험 기간마다 잠을 거의 못 잘 때
  - 시험 뒤 며칠씩 방에서 나오지 않을 때
limits: 쉬는 시간 답 맞추기에 대한 직접 연구는 없다. 작업기억과 불안 연구에서 추론한 내용(D).
related: [시험 중 머리가 하얘짐, 친구 진도에 조바심이 남]
sources: [cepeda-2006, beilock-2001, weiner-1985, jamieson-2010]
books: [unknown, make-it-stick]
history:
  - date: '2026.10.27'
    note: 등재
