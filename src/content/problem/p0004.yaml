id: P-0004
title: 외운 것이 떠오르지 않음/고등학생
category: 기억·인출
line: 내신이나 모의고사에서 범위가 넓어지자 외운 것끼리 섞이고, 한 문제 막힌 게 시험 전체를 흔드는 상황
ages: [고등]
grade: A
facets:
  when: [시험 중, 공부 중]
  where: [교실, 독서실]
  with: [혼자]
  subject: [암기, 서술, 전 과목]
  freq: 매주
factors:
  main: 불안·긴장
  sub: [수치심·자책, 부담·기대]
says:
  - who: 아이
    text: 이거 생윤이었나 윤사였나 헷갈려
  - who: 아이
    text: 등급 떨어지면 끝이야
signals:
  body: [턱에 힘이 들어감, 두통, 시험 후 녹초]
  thought: ['이 문제 틀리면 등급 컷', '다 외웠는데 왜']
  action: [한 문제에 5분 넘게 머묾, 남은 시간 계산을 반복]
flow:
  trigger: 비슷한 개념 두 개가 동시에 떠올라 고를 수 없음
  thought: '"이거 틀리면 등급 떨어진다"'
  feel: 턱과 어깨가 굳고 숨이 짧아짐
  pattern: 남은 시간을 반복해서 계산하며 그 문제에 머묾
  break: 뒤쪽 아는 문제를 시간 부족으로 놓침
  residue: '"난 실전에 약하다"는 이름표가 생김'
causes:
  - 비슷한 개념을 따로따로만 외워서 구별 연습이 없음 → [[교차 연습]]
  - 등급이라는 압박이 작업 공간을 차지함 → [[압박 속 수행 저하]]
  - 스트레스가 인출 자체를 방해함 → [[스트레스와 기억 인출]]
triggers:
  - text: 2분 넘게 막히면 표시하고 넘어가는 규칙을 시험 전에 정하기
    when: 시험 전
    time: 10초
    who: 본인
    grade: D
  - text: 날숨 길게 세 번 쉬고 다음 문제
    when: 턱이 굳을 때
    time: 30초
    who: 본인
    grade: C
  - text: 헷갈리는 두 개념을 나란히 놓고 차이 한 줄 쓰기
    when: 공부 중
    time: 3분
    who: 본인
    grade: B
solutions:
  - method: '[[섞어 풀기]]'
    basis: '[[교차 연습]]'
    grade: B
    time: 30분
    age: 고1 이상
  - method: '[[백지 인출]]'
    basis: '[[스트레스와 기억 인출]]'
    grade: B
    time: 15분
    age: 고1 이상
  - method: '[[날숨 길게 쉬기]]'
    basis: '[[느린 호흡]]'
    grade: C
    time: 30초
    age: 전 연령
talk:
  - avoid: 이번엔 몇 등급이야?
    instead: 시험 볼 때 어디서 시간이 제일 많이 갔어?
  - avoid: 너 실전에 약한 거 고쳐야 해
    instead: 막혔을 때 넘어가는 규칙 같은 거 정해 봤어?
small:
  today: 헷갈리는 개념 한 쌍의 차이를 한 줄로 쓰기
  week: 과목 두 개를 섞은 문제 20개 풀기
  month: 모의고사 때 넘어간 문제 개수와 돌아와서 맞힌 개수 기록
recovery:
  - 넘어갔다가 돌아와서 맞힌 문제가 생김
  - 시험 뒤 '실전에 약하다' 대신 구체적인 문제를 말함
expert:
  - 시험 전 공황처럼 숨이 안 쉬어질 때
  - 성적 때문에 자해나 극단적인 말을 할 때
limits: 교차 연습 연구는 수학 중심. 사회탐구 같은 암기 과목의 근거는 아직 적다.
related: [시험 중 머리가 하얘짐, 아는 문제인데 시험에서 틀림]
sources: [rohrer-2007, beilock-2001, dequervain-1998, smith-2016, zaccaro-2018]
books: [unknown, make-it-stick]
history:
  - date: '2026.10.27'
    note: 등재
