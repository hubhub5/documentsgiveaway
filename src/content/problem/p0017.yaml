id: P-0017
title: 완벽하게 못 할 바엔 안 함
category: 감정·자기평가
line: 다 맞을 자신이 없으면 시작을 안 하거나, 일부러 공부 안 한 척을 하는 상황
ages: [초고, 중등, 고등]
grade: B
facets:
  when: [시작 전, 시험 직전]
  where: [집 책상]
  with: [혼자, 친구와]
  subject: [전 과목]
  freq: 매주
factors:
  main: 완벽주의
  sub: [회피, 수치심·자책]
says:
  - who: 아이
    text: 다 맞을 거 아니면 의미 없어
  - who: 아이
    text: 나 어제 하나도 안 했어
signals:
  body: [시작 직전 긴장]
  thought: ['제대로 못 할 거면', '틀리면 들킨다']
  action: [필기를 처음부터 다시 씀, 친구에게 공부 안 했다고 말함]
flow:
  trigger: 완벽하게 해낼 수 없을 것 같은 과제를 봄
  thought: '"어차피 다 못 할 텐데"'
  feel: 긴장과 함께 피하고 싶은 마음
  pattern: 시작을 미루거나 '안 했다'고 미리 말해 둠
  break: 실제로 덜 준비한 채 시험을 봄
  residue: '"안 해서 그래"가 "못해서 그래"보다 덜 아프다는 걸 배움'
causes:
  - 실패가 능력 문제로 보이는 걸 막으려는 보호 → [[자기 불구화]]
  - 남들이 나에게 완벽을 바란다는 느낌 → [[완벽주의]]
triggers:
  - text: 목표를 '다 맞기'에서 '끝까지 써 보기'로 바꿔 말하기
    when: 시작 전
    time: 30초
    who: 본인
    grade: D
  - text: 일부러 70점짜리 필기를 해 보기
    when: 필기할 때
    time: 10분
    who: 본인
    grade: D
  - text: 결과보다 끝까지 한 것 자체를 짚어 주기
    when: 결과 이야기
    time: 30초
    who: 엄마
    grade: B
solutions:
  - method: '[[2분 시작]]'
    basis: '[[미루기와 기분 조절]]'
    grade: D
    time: 2분
    age: 전 연령
  - method: '[[친구에게 하듯 다시 말하기]]'
    basis: '[[자기 자비]]'
    grade: B
    time: 1분
    age: 초4 이상
talk:
  - avoid: 넌 하면 잘하잖아
    instead: 끝까지 해 본 거 그 자체가 오늘 할 일이야
  - avoid: 왜 공부 안 했다고 거짓말해?
    instead: 공부한 거 들키는 게 더 무서웠어?
small:
  today: 틀려도 되는 연습 문제 다섯 개만 풀기
  week: 일부러 대충 한 필기 한 번 해 보기
  month: '"다 맞기" 대신 "끝까지" 목표로 쪽지 시험 세 번'
recovery:
  - 완벽하지 않아도 일단 시작함
  - 공부한 걸 숨기지 않음
expert:
  - 확인, 반복 행동 때문에 숙제를 끝내지 못하는 일이 잦을 때
limits: 자기 불구화 연구는 대학생 실험 중심. 아이에게 적용한 말은 현장 관찰(D).
related: [틀리면 바로 자책함, 계획 세우는 데만 시간을 씀, 하루 밀리면 전부 놓아버림]
sources: [berglas-1978, covington-2000, curran-2019, breines-2012, mueller-1998]
books: [love-yourself, mindset]
history:
  - date: '2026.10.27'
    note: 등재
