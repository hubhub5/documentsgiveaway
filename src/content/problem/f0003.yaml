id: F-0003
title: 성적표 앞에서 표정 관리가 안 됨
audience: 부모
category: 부모
line: ‘괜찮다’고 말하면서도 얼굴에 실망이 그대로 드러나고, 아이가 그걸 먼저 읽는 상황
ages: [부모]
grade: C
facets:
  when: [결과 후]
  where: [거실]
  with: [엄마 옆]
  subject: [전 과목]
  freq: 가끔
factors:
  main: 부담·기대
  sub: [비교·조바심]
says:
  - who: 엄마
    text: 괜찮아… (한숨)
  - who: 아이
    text: 괜찮다면서 표정은 왜 그래
signals:
  body: [표정이 굳음, 한숨]
  thought: ['이 점수면 어디 가지', '학원 바꿔야 하나']
  action: [성적표를 오래 들여다봄, 다른 과목 점수를 먼저 물음]
flow:
  trigger: 기대보다 낮은 점수를 봄
  thought: '"이 정도밖에?"'
  feel: 실망과 걱정이 얼굴로 먼저 나옴
  pattern: 말로는 괜찮다며 질문으로 원인을 캠
  break: 아이가 말을 닫고 다음부터 성적표를 늦게 보여 줌
  residue: 결과를 숨기는 패턴 → [[부모를 실망시킬까 두려움]]
causes:
  - 말과 표정이 다르면 아이는 표정을 믿음
  - 실망 표현이 아이에겐 애정 철회로 느껴질 수 있음 → [[심리적 통제]]
triggers:
  - text: 성적표는 혼자 먼저 보고 10분 뒤에 이야기
    when: 성적표 받은 날
    time: 10분
    who: 엄마
    grade: D
  - text: '"엄마도 좀 아쉽다"고 솔직하게, 그 뒤엔 아이 이야기 듣기'
    when: 대화할 때
    time: 1분
    who: 엄마
    grade: D
solutions:
  - method: '[[친구에게 하듯 다시 말하기]]'
    basis: '[[자기 자비]]'
    grade: B
    time: 1분
    age: 성인
talk:
  - avoid: (한숨) 괜찮아
    instead: 엄마도 좀 아쉬워. 너는 어땠어?
  - avoid: 다른 애들은 몇 점이야?
    instead: 어떤 과목이 제일 마음에 걸려?
small:
  today: 성적 이야기는 저녁 먹고 나서 하기로 정하기
  week: 결과 대화에서 질문은 하나만 하기
  month: 성적표를 받은 날 아이가 좋아하는 일을 같이 하기
recovery:
  - 아이가 성적표를 먼저 보여 줌
  - 결과 대화가 10분 안에 끝남
expert:
  - 성적 때문에 아이와 대화가 몇 주째 끊겼을 때
limits: 표정과 아이 반응의 직접 연구는 이 사전에 없다. 통제적 양육 연구에서 추론(C).
leadsTo: [부모를 실망시킬까 두려움]
related: [아이보다 내가 더 불안함, 다른 집 아이와 비교하게 됨]
sources: [barber-1996, neff-2003]
books: [between-parent-child, emotion-coaching]
history:
  - date: '2026.10.27'
    note: 등재
